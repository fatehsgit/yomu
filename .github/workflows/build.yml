name: Build Yomu APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Yomu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/yomu-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk release-apks/yomu-universal.apk
          fi
          if [ -f app/build/outputs/apk/release/app-x86_64-release.apk ]; then
            cp app/build/outputs/apk/release/app-x86_64-release.apk release-apks/yomu-x86_64.apk
          fi
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -la release-apks/

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Emulator & Capture UI Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Installing Yomu APK..."
            adb install -r release-apks/yomu-x86_64.apk || adb install -r release-apks/app-x86_64-release.apk
            echo "Launching Yomu MainActivity..."
            adb shell am start -n app.yomu.reader/eu.kanade.tachiyomi.ui.main.MainActivity
            sleep 8
            echo "Capturing Phone (folded) screenshot..."
            adb exec-out screencap -p > release-apks/screenshot_home_closed.png
            echo "Switching to Galaxy Z Fold unfolded resolution (1812x2176, 420dpi)..."
            adb shell wm size 1812x2176
            adb shell wm density 420
            sleep 4
            echo "Capturing Galaxy Z Fold (unfolded) screenshot..."
            adb exec-out screencap -p > release-apks/screenshot_home_unfolded.png
            ls -lh release-apks/*.png

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomu-v0.21.10-release
          path: |
            release-apks/*.apk
            release-apks/*.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.10-yomu
          name: "Yomu v0.21.10 (Refonte UI Complète — Écrans OLED Sombre, Capsules & Violet Néon)"
          body: |
            ## Yomu v0.21.10 — Refonte Visuelle Intégrale (Design Sombre OLED & Violet Néon)

            ### Nouveautés de cette version :
            - **Écran Historique de lecture** :
              - Cartes sombres individuelles (`#141221`) avec liseré violet subtil (`#2A243D`) et jaquettes arrondies 14dp.
              - Bouton capsule interactif « Reprendre » en violet éclatant (`#8B5CF6`).
              - Séparateurs chronologiques stylisés en pastilles sombres à puce lumineuse violette.
            - **Écran Plus / Profil & Paramètres** :
              - En-tête profil personnalisé Fateh avec badge Administrateur et statut de synchronisation NAS (`nasgroot` DS720+).
              - Grandes cartes modulaires pour l'Apparence, la Bibliothèque, les Données et le Lecteur.
              - Switch « Mode Incognito » revisité en violet néon et carte résumé de la file de téléchargement.
            - **Écran Explorer / Sources & Extensions** :
              - Encapsulation des sources dans des cartes sombres avec logos adoucis et micro-pastilles de langues.
              - Boutons « Derniers » en pastilles et en-têtes d'extensions avec action « Tout mettre à jour » stylisée.
            - **Écran Mises à jour** :
              - Séparateurs temporels convertis en pastilles capsules et barre d'outils épurée sans bandeau gris opaque.
            - **Écran Statistiques** :
              - Tuiles OLED sombres avec bordures violettes et métriques ultra-contrastées en blanc pur.
            - **File de téléchargement** :
              - Cartes arrondies pour chaque téléchargement actif avec barre de progression fine violet néon (`#8B5CF6`).
            - **Navigation Dock & Barre de recherche** :
              - Dock translucide en verre dépoli (`#E6100E1D`) avec pastille pilule douce sur l'onglet actif.
              - Barre de recherche globale convertie en capsule sombre avec liseré violet.
            - **Badges et capsules système** :
              - Tous les badges (genres, statuts, non lus) arrondis façon capsules pilules douces (999dp).

            ### Fichiers :
            - **`yomu-arm64-v8a.apk`** : Recommandé pour Galaxy Z Fold (architecture 64-bit).
            - **`yomu-universal.apk`** : Compatible tous appareils Android.
            - **`screenshot_home_closed.png` / `screenshot_home_unfolded.png`** : Aperçus réels capturés sur l'émulateur CI.
          files: |
            release-apks/yomu-arm64-v8a.apk
            release-apks/yomu-universal.apk
            release-apks/*.apk
            release-apks/*.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
