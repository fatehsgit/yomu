name: Build Yomu APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Yomu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/yomu-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk release-apks/yomu-universal.apk
          fi
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomu-apks
          path: release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.5-yomu
          name: "Yomu v0.21.5 (En-tête Fateh & Hero Card Reprendre)"
          body: |
            ## Yomu v0.21.5 — En-tête personnalisé Fateh & Hero Card de lecture

            ### Nouveautés de cette version :
            - **En-tête personnalisé Fateh ✦** :
              - Salutation dynamique (« Bonjour » / « Good evening ») selon l'heure.
              - Titre « Fateh ✦ » et avatar avec anneau dégradé violet/indigo.
            - **Hero Card « Reprendre la lecture »** :
              - Affiche le dernier manga lu avec couverture 2:3, titre, numéro de chapitre et badge pulsé.
              - Bouton pilule violet « Reprendre » ouvrant directement le lecteur.
            - **Thème Sombre OLED forcé** :
              - Verrouillage du thème sombre Dark Violet (#08090E & #8B5CF6) même en mode jour système.
            - **Mise à niveau directe** : Version 0.21.5 (code 41) permettant la mise à jour directe par-dessus l'APK précédente.

            ### Téléchargement :
            - **`yomu-arm64-v8a.apk`** : Pour Galaxy Z Fold (architecture 64-bit).
            - **`yomu-universal.apk`** : Pour tous appareils Android.
          files: |
            release-apks/yomu-arm64-v8a.apk
            release-apks/yomu-universal.apk
            release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
