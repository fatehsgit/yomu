name: Build Yomu APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Yomu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew assembleRelease -Pdist=ci --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/yomu-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk release-apks/yomu-universal.apk
          fi
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomu-apks
          path: release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.3-yomu
          name: "Yomu v0.21.3 (Z Fold Edition)"
          body: |
            ## Yomu - Lecteur Manga Moderne pour Galaxy Z Fold

            ### Nouveautés et caractéristiques :
            - **Optimisation pliable Galaxy Z Fold** :
              - En mode **déplié** (écran intérieur) : Dock centré sur le bord droit (**NavigationRail** sous le pouce droit) pour une ergonomie optimale à deux mains.
              - En mode **fermé** (écran externe) : Barre de navigation standard en bas.
            - **Catalogue d'extensions Keiyoushi préconfiguré** :
              - Aucun lien de repo à copier/coller : toutes les extensions manga (Scan-FR, MangaDex, Webtoon, etc.) sont disponibles immédiatement dans l'onglet Explorer.
            - **Package ID dédié** : `app.yomu.reader` (s'installe en parallèle sans conflit).
            - **Performance native** : 100% Kotlin & Jetpack Compose, décodage matériel et fluidité 120 Hz.

            ### Téléchargement :
            - **`yomu-arm64-v8a.apk`** : Recommandé pour votre Galaxy Z Fold (processeur 64 bits optimisé).
            - **`yomu-universal.apk`** : Compatible avec tous les appareils Android.
          files: |
            release-apks/yomu-arm64-v8a.apk
            release-apks/yomu-universal.apk
            release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
