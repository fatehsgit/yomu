name: Build Yomu APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Yomu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/yomu-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk release-apks/yomu-universal.apk
          fi
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomu-apks
          path: release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.4-yomu
          name: "Yomu v0.21.4 (Design Sombre Violet OLED & Z Fold)"
          body: |
            ## Yomu v0.21.4 — Design Sombre Violet OLED & Galaxy Z Fold

            ### Nouveautés de cette version :
            - **Nouveau Thème Visuel Natif (Palette Maquette)** :
              - Fond sombre OLED profond (`#08090E`) et surfaces nuit (`#0F111A`)
              - Accents violet électrique (`#8B5CF6` / `#A78BFA`) pour les sélections, badges et boutons
              - Cartes de manga stylisées (`#141624`) avec coins arrondis modernes (12 dp / 16 dp)
              - Badges de chapitres non lus violet et téléchargements émeraude (`#34D399`)
              - Thème sombre et palette Yomu actifs par défaut sur tous les appareils, y compris Android 17 / One UI 9 (sans écrasement par Monet).
            - **Optimisation pliable Galaxy Z Fold (Seuil 550 dp)** :
              - Écran intérieur déplié (576–588 dp) : bascule automatique en mode tablette avec Navigation Rail sur le côté droit sous le pouce.
              - Écran externe fermé : navigation compacte en bas.
            - **Catalogue Keiyoushi & Sources intégrées** :
              - Sources manga directement opérationnelles dans l'onglet Explorer.
            - **Mise à niveau directe** : Version 0.21.4 (code 40) permettant la mise à jour directe par-dessus l'APK précédente.

            ### Téléchargement :
            - **`yomu-arm64-v8a.apk`** : Pour Galaxy Z Fold (architecture 64-bit).
            - **`yomu-universal.apk`** : Pour tous appareils Android.
          files: |
            release-apks/yomu-arm64-v8a.apk
            release-apks/yomu-universal.apk
            release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
