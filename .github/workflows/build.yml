name: Build Yomu APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Yomu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/yomu-arm64-v8a.apk
          fi
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk release-apks/yomu-universal.apk
          fi
          if [ -f app/build/outputs/apk/release/app-x86_64-release.apk ]; then
            cp app/build/outputs/apk/release/app-x86_64-release.apk release-apks/yomu-x86_64.apk
          fi
          cp app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -la release-apks/

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Emulator & Capture UI Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Installing Yomu APK..."
            adb install -r release-apks/yomu-x86_64.apk || adb install -r release-apks/app-x86_64-release.apk
            echo "Launching Yomu MainActivity..."
            adb shell am start -n app.yomu.reader/eu.kanade.tachiyomi.ui.main.MainActivity
            sleep 8
            echo "Capturing Phone (folded) screenshot..."
            adb exec-out screencap -p > release-apks/screenshot_home_closed.png
            echo "Switching to Galaxy Z Fold unfolded resolution (1812x2176, 420dpi)..."
            adb shell wm size 1812x2176
            adb shell wm density 420
            sleep 4
            echo "Capturing Galaxy Z Fold (unfolded) screenshot..."
            adb exec-out screencap -p > release-apks/screenshot_home_unfolded.png
            ls -lh release-apks/*.png

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomu-v0.21.7-release
          path: |
            release-apks/*.apk
            release-apks/*.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.8-yomu
          name: "Yomu v0.21.8 (Dock Glossy Translucide, Déblocage Captures & Filtre Bibliothèque)"
          body: |
            ## Yomu v0.21.8 — Dock Glossy Translucide, Déblocage Captures & Filtre Bibliothèque

            ### Nouveautés de cette version :
            - **Dock Glossy Translucide & Design Épuré** :
              - Verre fumé sombre translucide (`#99120F24` / 60% d'opacité) avec liseré violet élégant façon verre poli (*frosted glass*).
              - Suppression intégrale de la surbrillance rectangulaire terne : l'onglet sélectionné s'illumine en violet éclatant (`#C084FC`) avec ripple subtil au toucher.
            - **Déblocage complet des captures d'écran** :
              - Neutralisation totale du `FLAG_SECURE` Android : captures d'écran et enregistrements autorisés partout dans l'application.
            - **Déverrouillage du filtre « Téléchargé uniquement »** :
              - Réinitialisation automatique au lancement pour restaurer immédiatement l'accès à tous les mangas de la bibliothèque (en ligne et hors ligne).
              - Déverrouillage du filtre dans la boîte de dialogue de tri/filtre pour garder la main et désactiver le mode téléchargé en un clic.
            - **Signature permanente (Keystore fixe)** :
              - Clé cryptographique officielle Yomu conservée (mise à jour directe sans désinstallation préalable requise).

            ### Fichiers :
            - **`yomu-arm64-v8a.apk`** : Recommandé pour Galaxy Z Fold (architecture 64-bit).
            - **`yomu-universal.apk`** : Compatible tous appareils Android.
            - **`screenshot_home_closed.png` / `screenshot_home_unfolded.png`** : Aperçus réels générés par le CI.
          files: |
            release-apks/yomu-arm64-v8a.apk
            release-apks/yomu-universal.apk
            release-apks/*.apk
            release-apks/*.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
